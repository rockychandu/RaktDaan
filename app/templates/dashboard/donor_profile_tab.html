<div id="tab-profile" class="dashboard-tab-content">
    <div class="card hover-lift" style="margin-bottom: 28px;">
        <div class="flex-between" style="margin-bottom: 16px;">
            <div>
                <h2 class="font-heading" style="font-size: var(--font-size-xl); color: var(--text-primary);">Donor Profile Details</h2>
                <p style="font-size: var(--font-size-sm); color: var(--text-muted);">Authenticated profile records retrieved from backend API.</p>
            </div>
            <span class="badge badge-success">Live Session Active</span>
        </div>
        <hr style="margin: 16px 0;">
        <div class="grid-3" style="margin-top: 20px;">
            <div class="metric-card">
                <div class="metric-top">
                    <span class="metric-label">Account Status</span>
                    <div class="metric-icon-box">✅</div>
                </div>
                <div class="metric-value" style="font-size: var(--font-size-xl); color: var(--emerald-600);">ACTIVE</div>
                <div class="metric-subtext">Verified Record</div>
            </div>
            <div class="metric-card">
                <div class="metric-top">
                    <span class="metric-label">Next Eligible Date</span>
                    <div class="metric-icon-box">📅</div>
                </div>
                <div class="metric-value" style="font-size: var(--font-size-lg);">Today (Eligible)</div>
                <div class="metric-subtext">3 Months Interval Met</div>
            </div>
            <div class="metric-card">
                <div class="metric-top">
                    <span class="metric-label">Total Impact</span>
                    <div class="metric-icon-box">❤️</div>
                </div>
                <div class="metric-value">9 Lives</div>
                <div class="metric-subtext">3 Donations Completed</div>
            </div>
        </div>
    </div>
</div>
