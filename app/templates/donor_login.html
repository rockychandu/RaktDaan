{% extends "base.html" %}

{% block title %}Donor Login - RaktDaan{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 76px - 200px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
        <div class="text-center" style="margin-bottom: 30px;">
            <div class="brand-icon" style="margin: 0 auto 16px; width: 64px; height: 64px; font-size: 2rem;">🩸</div>
            <h1 class="font-heading" style="font-size: 1.9rem; color: var(--primary-dark); margin-bottom: 6px;">Donor Access</h1>
            <p class="text-muted-color" style="font-size: 0.95rem;">Enter your email and password to log in</p>
        </div>

        <div id="alert-box" class="alert-box alert-danger" style="display: none;"></div>

        <form id="donor-login-form">
            <div class="form-group">
                <label for="email" class="form-label">Donor Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="donor@example.com">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%; margin-top: 10px;">Sign In to Donor Portal</button>
        </form>

        <div class="text-center" style="margin-top: 25px; font-size: 0.95rem;">
            <span class="text-muted-color">New to RaktDaan?</span> 
            <a href="{{ url_for('ui.register_page') }}" style="font-weight: 700;">Register as Donor</a>
            <br><br>
            <a href="{{ url_for('ui.index_page') }}" class="text-muted-color">← Return to Main Page</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('donor-login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');
        
        alertBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerText = 'Verifying credentials...';

        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/v1/auth/donor/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('auth_token', data.access_token);
                localStorage.setItem('user_data', JSON.stringify(data.user));

                alertBox.className = 'alert-box alert-success';
                alertBox.innerText = 'Login successful! Opening Donor Dashboard...';
                alertBox.style.display = 'flex';

                setTimeout(() => {
                    window.location.href = '/donor/dashboard';
                }, 1000);
            } else {
                alertBox.className = 'alert-box alert-danger';
                alertBox.innerText = data.detail || 'Invalid email or password.';
                alertBox.style.display = 'flex';
            }
        } catch (err) {
            alertBox.className = 'alert-box alert-danger';
            alertBox.innerText = 'Network error connecting to backend API.';
            alertBox.style.display = 'flex';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign In to Donor Portal';
        }
    });
</script>
{% endblock %}
