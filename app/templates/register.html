<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - RaktDaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
        .reg-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 680px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .title { text-align: center; margin-bottom: 30px; }
        .title h1 { color: #dc2626; font-size: 2rem; margin-bottom: 8px; }
        .title p { color: #94a3b8; font-size: 1rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #cbd5e1; font-weight: 500; }
        input, select { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 0.95rem; transition: border-color 0.2s; }
        input:focus, select:focus { outline: none; border-color: #dc2626; }
        .btn { width: 100%; padding: 15px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: background 0.2s; margin-top: 15px; }
        .btn:hover { background: #b91c1c; }
        .alert { padding: 14px; border-radius: 8px; margin-bottom: 25px; font-size: 0.95rem; display: none; line-height: 1.5; }
        .alert-danger { background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; }
        .footer-links { text-align: center; margin-top: 25px; font-size: 0.95rem; color: #94a3b8; }
        .footer-links a { color: #dc2626; text-decoration: none; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="title">
            <h1>📝 Donor Registration</h1>
            <p>Fill out the form below to register as an official blood donor</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="register-form">
            <div class="grid-2">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="9876543210">
                </div>

                <div class="form-group">
                    <label for="emergency_contact">Emergency Contact Phone *</label>
                    <input type="tel" id="emergency_contact" required placeholder="9876543211">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="Password123!">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" required placeholder="Password123!">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="date_of_birth">Date of Birth *</label>
                    <input type="date" id="date_of_birth" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="blood_group">Blood Group *</label>
                    <select id="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" required placeholder="Mumbai">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="state">State *</label>
                    <input type="text" id="state" required placeholder="Maharashtra">
                </div>

                <div class="form-group">
                    <label for="address">Street Address *</label>
                    <input type="text" id="address" required placeholder="123 Main Street">
                </div>
            </div>

            <button type="submit" class="btn" id="submit-btn">Complete Donor Registration</button>
        </form>

        <div class="footer-links">
            Already registered? <a href="/donor/login">Login as Donor</a>
            <br><br>
            <a href="/">← Back to Portal Select</a>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Validating and creating account...';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                emergency_contact: document.getElementById('emergency_contact').value,
                password: document.getElementById('password').value,
                confirm_password: document.getElementById('confirm_password').value,
                date_of_birth: document.getElementById('date_of_birth').value,
                gender: document.getElementById('gender').value,
                blood_group: document.getElementById('blood_group').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Registration Successful! Redirecting to Donor Login...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/donor/login';
                    }, 1500);
                } else {
                    let errMsg = data.message || 'Registration failed.';
                    if (data.detail && typeof data.detail === 'object') {
                        errMsg = Object.values(data.detail).join(' | ');
                    } else if (data.detail) {
                        errMsg = data.detail;
                    }
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerText = errMsg;
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = 'Network error connecting to backend API.';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Complete Donor Registration';
            }
        });
    </script>
</body>
</html>
