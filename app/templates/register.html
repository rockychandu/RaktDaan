<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - RaktDaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --primary-light: #fff1f2;
            --primary-border: #fecdd3;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .reg-card {
            background: var(--card-bg);
            border: 2px solid var(--border-light);
            border-radius: 20px;
            width: 100%;
            max-width: 720px;
            padding: 45px;
            box-shadow: 0 15px 35px rgba(220, 38, 38, 0.08);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 16px;
            border: 1px solid var(--primary-border);
        }

        .brand-header h1 {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 13px 16px;
            background: #ffffff;
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-dark);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
            margin-top: 15px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            display: none;
            font-weight: 500;
            line-height: 1.5;
        }

        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecdd3;
            color: #991b1b;
        }

        .alert-success {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .footer-links {
            text-align: center;
            margin-top: 30px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="brand-header">
            <div class="brand-icon">📝</div>
            <h1>Donor Registration</h1>
            <p>Fill in your details below to register as a voluntary blood donor</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="register-form">
            <div class="grid-2">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="9876543210">
                </div>

                <div class="form-group">
                    <label for="emergency_contact">Emergency Contact Phone *</label>
                    <input type="tel" id="emergency_contact" required placeholder="9876543211">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="Password123!">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" required placeholder="Password123!">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="date_of_birth">Date of Birth *</label>
                    <input type="date" id="date_of_birth" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="blood_group">Blood Group *</label>
                    <select id="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" required placeholder="Mumbai">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="state">State *</label>
                    <input type="text" id="state" required placeholder="Maharashtra">
                </div>

                <div class="form-group">
                    <label for="address">Street Address *</label>
                    <input type="text" id="address" required placeholder="123 Main Street">
                </div>
            </div>

            <button type="submit" class="btn" id="submit-btn">Complete Donor Registration</button>
        </form>

        <div class="footer-links">
            Already registered? <a href="/donor/login">Login as Donor</a>
            <br><br>
            <a href="/">← Back to Main Portal</a>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Validating and registering...';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                emergency_contact: document.getElementById('emergency_contact').value,
                password: document.getElementById('password').value,
                confirm_password: document.getElementById('confirm_password').value,
                date_of_birth: document.getElementById('date_of_birth').value,
                gender: document.getElementById('gender').value,
                blood_group: document.getElementById('blood_group').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Registration Successful! Redirecting to Donor Login...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/donor/login';
                    }, 1500);
                } else {
                    let errMsg = data.message || 'Registration failed.';
                    if (data.detail && typeof data.detail === 'object') {
                        errMsg = Object.values(data.detail).join(' | ');
                    } else if (data.detail) {
                        errMsg = data.detail;
                    }
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerText = errMsg;
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = 'Network error connecting to backend API.';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Complete Donor Registration';
            }
        });
    </script>
</body>
</html>
