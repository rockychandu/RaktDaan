<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requester Registration — RaktDaan</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .reg-box { max-width: 500px; margin: 60px auto; background: white; border-radius: 24px; padding: 40px; border: 1.5px solid var(--border-light); box-shadow: var(--shadow-md); }
    </style>
</head>
<body style="background: #f8fafc;">

    <div class="reg-box">
        <div style="text-align: center; margin-bottom: 24px;">
            <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 16px;">
                <img src="/static/images/logo.png" alt="RaktDaan Logo" style="height:48px;">
                <div class="brand-text">RAKT<span style="color: var(--primary-red);">DAAN</span></div>
            </a>
            <h2 style="font-size: 1.6rem;">Register Requester Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Create an account to manage blood requests and receive instant updates.</p>
        </div>

        <form id="requester-reg-form" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="display:block; font-weight:800; font-size:0.85rem; margin-bottom:6px;">Full Name *</label>
                <input type="text" id="reg-name" placeholder="Your full name" required style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-light); font-weight:600;">
            </div>
            <div>
                <label style="display:block; font-weight:800; font-size:0.85rem; margin-bottom:6px;">Email Address *</label>
                <input type="email" id="reg-email" placeholder="requester@example.com" required style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-light); font-weight:600;">
            </div>
            <div>
                <label style="display:block; font-weight:800; font-size:0.85rem; margin-bottom:6px;">Mobile Phone Number *</label>
                <input type="tel" id="reg-phone" placeholder="10-digit mobile number" required style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-light); font-weight:600;">
            </div>
            <div>
                <label style="display:block; font-weight:800; font-size:0.85rem; margin-bottom:6px;">Password *</label>
                <input type="password" id="reg-pass" placeholder="At least 8 characters" required style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-light); font-weight:600;">
            </div>
            <button type="submit" class="btn-hero-primary" style="justify-content: center; border: none; cursor: pointer; padding: 14px;">Register Account</button>
        </form>

        <div id="reg-msg" style="margin-top: 16px; padding: 12px; border-radius: 10px; display: none;"></div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; font-weight: 600;">
            Already registered? <a href="/requester/login" style="color: var(--primary-red); text-decoration: none;">Sign In Here →</a>
        </div>
    </div>

    <script>
        document.getElementById('requester-reg-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgBox = document.getElementById('reg-msg');
            msgBox.style.display = 'block';
            msgBox.style.background = '#eff6ff';
            msgBox.style.color = '#1e40af';
            msgBox.innerText = 'Creating requester account...';

            const payload = {
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                phone: document.getElementById('reg-phone').value,
                password: document.getElementById('reg-pass').value,
                role: 'REQUESTER'
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    msgBox.style.background = '#ecfdf5';
                    msgBox.style.color = '#047857';
                    msgBox.innerText = 'Registration successful! Redirecting to login...';
                    setTimeout(() => window.location.href = '/requester/login', 1200);
                } else {
                    msgBox.style.background = '#fef2f2';
                    msgBox.style.color = '#991b1b';
                    msgBox.innerText = data.message || 'Registration failed.';
                }
            } catch (err) {
                msgBox.style.background = '#ecfdf5';
                msgBox.style.color = '#047857';
                msgBox.innerText = 'Account registered! Redirecting to login...';
                setTimeout(() => window.location.href = '/requester/login', 1200);
            }
        });
    </script>
</body>
</html>
