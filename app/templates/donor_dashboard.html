<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - RaktDaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 30px 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 30px; background: #1e293b; padding: 15px 25px; border-radius: 12px; border: 1px solid #334155; }
        .nav h1 { color: #dc2626; font-size: 1.5rem; }
        .btn-logout { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn-logout:hover { background: #475569; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; margin-bottom: 25px; }
        .card h2 { color: #f8fafc; margin-bottom: 15px; font-size: 1.3rem; }
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .info-item { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .info-label { color: #94a3b8; font-size: 0.85rem; margin-bottom: 5px; }
        .info-val { color: #f8fafc; font-weight: 600; font-size: 1.05rem; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
    </style>
</head>
<body>
    <div class="nav">
        <h1>🩸 Donor Dashboard</h1>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Welcome Back, <span id="user-name">Donor</span>! <span class="badge">ELIGIBLE</span></h2>
            <p style="color: #94a3b8;">Your authenticated donor session is active. Below are your account details retrieved securely from the backend API.</p>

            <div class="profile-grid">
                <div class="info-item">
                    <div class="info-label">Full Name</div>
                    <div class="info-val" id="val-name">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Email Address</div>
                    <div class="info-val" id="val-email">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Blood Group</div>
                    <div class="info-val" id="val-blood" style="color: #dc2626;">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">City</div>
                    <div class="info-val" id="val-city">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Emergency Contact</div>
                    <div class="info-val" id="val-emergency">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = '/donor/login';
        }

        async function loadProfile() {
            try {
                const res = await fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    logout();
                    return;
                }

                const data = await res.json();
                document.getElementById('user-name').innerText = data.name;
                document.getElementById('val-name').innerText = data.name;
                document.getElementById('val-email').innerText = data.email;

                if (data.donor_profile) {
                    document.getElementById('val-blood').innerText = data.donor_profile.blood_group;
                    document.getElementById('val-city').innerText = data.donor_profile.city;
                    document.getElementById('val-emergency').innerText = data.donor_profile.emergency_contact;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function logout() {
            try {
                await fetch('/api/v1/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (e) {}
            localStorage.clear();
            window.location.href = '/donor/login';
        }

        loadProfile();
    </script>
</body>
</html>
