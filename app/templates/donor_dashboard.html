{% extends "base.html" %}

{% block title %}Donor Dashboard - RaktDaan{% endblock %}

{% block content %}
{% include "dashboard/donor_dashboard_ui.html" %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script>
    const token = localStorage.getItem('auth_token');
    if (!token) {
        window.location.href = '/donor/login';
    }

    async function loadProfile() {
        try {
            const res = await fetch('/api/v1/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) {
                logout();
                return;
            }

            const data = await res.json();
            
            // Bind profile fields across UI
            if (document.getElementById('dash-greeting-name')) document.getElementById('dash-greeting-name').innerText = data.name;
            if (document.getElementById('db-user-name')) document.getElementById('db-user-name').innerText = data.name;
            if (document.getElementById('prof-name')) document.getElementById('prof-name').innerText = data.name;
            if (document.getElementById('prof-email')) document.getElementById('prof-email').innerText = data.email;

            if (data.donor_profile) {
                if (document.getElementById('dash-blood-group')) document.getElementById('dash-blood-group').innerText = data.donor_profile.blood_group;
                if (document.getElementById('prof-blood')) document.getElementById('prof-blood').innerText = data.donor_profile.blood_group;
                if (document.getElementById('prof-city')) document.getElementById('prof-city').innerText = data.donor_profile.city;
                if (document.getElementById('prof-emergency')) document.getElementById('prof-emergency').innerText = data.donor_profile.emergency_contact;
            }
        } catch (err) {
            console.error('Error loading donor profile:', err);
        }
    }

    async function logout() {
        try {
            await fetch('/api/v1/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch (e) {}
        localStorage.clear();
        window.location.href = '/donor/login';
    }

    loadProfile();

    // Render dashboard blood availability preview
    document.addEventListener('DOMContentLoaded', () => {
        const dbUI = new BloodAvailabilityUI('dashboard-inventory-preview');
        dbUI.render();
    });
</script>
{% endblock %}
