<section id="feedback-section" class="section-padding bg-light">
    <div class="container container-narrow">
        <div class="section-header">
            <span class="section-tag">Continuous Improvement</span>
            <h2 class="section-title">Donor & Hospital Feedback</h2>
            <p class="section-subtitle">We value your experience. Share your feedback to help us improve RaktDaan.</p>
        </div>

        <div class="card">
            <form id="feedback-form" onsubmit="event.preventDefault(); showToast('Thank you for your feedback!', 'success'); this.reset();">
                <div class="form-group">
                    <label for="fb-rating" class="form-label">How would you rate your overall experience?</label>
                    <select id="fb-rating" class="form-control" required>
                        <option value="5">⭐⭐⭐⭐⭐ Excellent (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ Good (4/5)</option>
                        <option value="3">⭐⭐⭐ Average (3/5)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fb-comments" class="form-label">Your Feedback / Suggestions</label>
                    <textarea id="fb-comments" class="form-control" rows="4" required placeholder="Tell us about your donation or blood search experience..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
            </form>
        </div>
    </div>
</section>
