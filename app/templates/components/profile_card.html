{% macro render_profile_card(name, role='Voluntary Donor', email='', blood_group='', city='') %}
<div class="card">
    <div class="flex-between" style="margin-bottom: 20px;">
        <div style="display: flex; gap: 16px; align-items: center;">
            <div class="avatar-icon" style="width: 56px; height: 56px; font-size: 1.6rem;">🩸</div>
            <div>
                <h3 style="margin-bottom: 4px;">{{ name }}</h3>
                <span class="badge badge-success">{{ role }}</span>
            </div>
        </div>
        {% if blood_group %}
        <div class="blood-type-badge" style="width: 48px; height: 48px; font-size: 1.1rem; margin-bottom: 0;">{{ blood_group }}</div>
        {% endif %}
    </div>

    <div class="form-row" style="gap: 12px; margin-top: 16px;">
        <div style="background: var(--bg-main); padding: 12px 16px; border-radius: var(--radius-md);">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">EMAIL</div>
            <div style="font-weight: 700; font-size: 0.95rem;">{{ email or 'donor@example.com' }}</div>
        </div>
        <div style="background: var(--bg-main); padding: 12px 16px; border-radius: var(--radius-md);">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">CITY</div>
            <div style="font-weight: 700; font-size: 0.95rem;">{{ city or 'Mumbai' }}</div>
        </div>
    </div>
</div>
{% endmacro %}
