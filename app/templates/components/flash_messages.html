{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container" style="margin-top: 20px;">
      {% for category, message in messages %}
        <div class="alert-box alert-{{ category if category != 'error' else 'danger' }}" role="alert">
          <span>{% if category == 'success' %}✅{% elif category in ['error', 'danger'] %}❌{% else %}ℹ️{% endif %}</span>
          <div>{{ message }}</div>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
