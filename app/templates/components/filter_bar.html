<div class="card" style="padding: 20px; margin-bottom: 24px;">
    <div class="flex-between" style="flex-wrap: wrap; gap: 16px;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
            <span style="font-weight: 700; font-size: var(--font-size-xs); text-transform: uppercase; color: var(--text-muted);">Filter Group:</span>
            <button class="btn btn-outline btn-sm filter-chip active" data-filter="ALL">All</button>
            <button class="btn btn-outline btn-sm filter-chip" data-filter="A+">A+</button>
            <button class="btn btn-outline btn-sm filter-chip" data-filter="B+">B+</button>
            <button class="btn btn-outline btn-sm filter-chip" data-filter="O+">O+</button>
            <button class="btn btn-outline btn-sm filter-chip" data-filter="AB+">AB+</button>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <select class="form-control" style="width: auto; padding: 8px 36px 8px 12px;">
                <option value="NEWEST">Sort by: Newest</option>
                <option value="UNITS">Sort by: Available Units</option>
                <option value="CITY">Sort by: City</option>
            </select>
        </div>
    </div>
</div>
