{% extends "base.html" %}

{% block title %}Admin Dashboard - RaktDaan{% endblock %}

{% block content %}
{% include "dashboard/admin_dashboard_ui.html" %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script>
    const token = localStorage.getItem('auth_token');
    if (!token) {
        window.location.href = '/admin/login';
    }

    async function loadAdmin() {
        try {
            const res = await fetch('/api/v1/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) {
                logout();
                return;
            }

            const data = await res.json();
            if (data.role !== 'ADMIN') {
                alert('Access Restricted. Account is not an Administrator.');
                logout();
                return;
            }

            if (document.getElementById('admin-user-name')) {
                document.getElementById('admin-user-name').innerText = data.email;
            }
        } catch (err) {
            console.error('Error loading admin profile:', err);
        }
    }

    async function logout() {
        try {
            await fetch('/api/v1/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch (e) {}
        localStorage.clear();
        window.location.href = '/admin/login';
    }

    loadAdmin();
</script>
{% endblock %}
