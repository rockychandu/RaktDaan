<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request History — RaktDaan</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .history-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .filter-card { background: white; border-radius: 20px; padding: 24px; border: 1.5px solid var(--border-light); box-shadow: var(--shadow-sm); margin-bottom: 24px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .filter-grid input, .filter-grid select { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border-light); font-weight: 600; font-size: 0.88rem; }
        .table-card { background: white; border-radius: 20px; padding: 24px; border: 1.5px solid var(--border-light); box-shadow: var(--shadow-md); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 14px; font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid #f1f5f9; }
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    </style>
</head>
<body>

    <nav class="navbar-sticky">
        <div class="container navbar-flex">
            <a href="/" class="brand-logo">
                <img src="/static/images/logo.png" alt="RaktDaan Logo" style="height:44px;">
                <div class="brand-text">RAKT<span style="color: var(--primary-red);">DAAN</span></div>
            </a>
            <div class="nav-portals-group">
                <a href="/requester/dashboard" class="btn-top-emergency">📊 Dashboard</a>
                <a href="/request-blood" class="btn-hero-primary" style="padding:8px 16px;">+ Request Blood</a>
            </div>
        </div>
    </nav>

    <div class="history-container">
        <div style="margin-bottom: 24px;">
            <div class="hero-badge-tag">📜 HISTORICAL RECORDS</div>
            <h1 style="font-size: 2.2rem;">Request History & Audit Log</h1>
        </div>

        <!-- FILTERS -->
        <div class="filter-card">
            <div class="filter-grid">
                <div>
                    <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Search Query</label>
                    <input type="text" id="filter-search" placeholder="Request ID, Patient, Hospital...">
                </div>
                <div>
                    <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Blood Group</label>
                    <select id="filter-bg">
                        <option value="">All Groups</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Status</label>
                    <select id="filter-status">
                        <option value="">All Statuses</option>
                        <option value="SUBMITTED">SUBMITTED</option>
                        <option value="APPROVED">APPROVED</option>
                        <option value="MATCHING_DONORS">MATCHING_DONORS</option>
                        <option value="PARTIALLY_FULFILLED">PARTIALLY_FULFILLED</option>
                        <option value="FULFILLED">FULFILLED</option>
                        <option value="REJECTED">REJECTED</option>
                        <option value="CANCELLED">CANCELLED</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Priority</label>
                    <select id="filter-urgency">
                        <option value="">All Urgency</option>
                        <option value="NORMAL">NORMAL</option>
                        <option value="URGENT">URGENT</option>
                        <option value="EMERGENCY">EMERGENCY</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Sort By</label>
                    <select id="filter-sort">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="highest_priority">Highest Priority</option>
                    </select>
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <button type="button" class="btn-hero-primary" onclick="loadRequestHistory(1)" style="width:100%; justify-content:center;">Apply Filters</button>
                </div>
            </div>
        </div>

        <!-- HISTORY TABLE -->
        <div class="table-card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Patient Name</th>
                            <th>Group</th>
                            <th>Component</th>
                            <th>Units</th>
                            <th>Hospital</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="10" style="text-align:center; color:var(--text-muted); padding:30px;">Loading historical records...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <div class="pagination-bar">
                <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted);" id="pagination-info">Showing page 1</div>
                <div style="display:flex; gap:8px;">
                    <button type="button" class="btn-top-emergency" id="btn-prev" onclick="changePage(-1)">← Previous</button>
                    <button type="button" class="btn-top-emergency" id="btn-next" onclick="changePage(1)">Next →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadRequestHistory(page = 1) {
            currentPage = page;
            const search = document.getElementById('filter-search').value;
            const bg = document.getElementById('filter-bg').value;
            const status = document.getElementById('filter-status').value;
            const urgency = document.getElementById('filter-urgency').value;
            const sort = document.getElementById('filter-sort').value;

            const url = `/api/blood-requests?page=${page}&per_page=10&search=${encodeURIComponent(search)}&blood_group=${encodeURIComponent(bg)}&status=${encodeURIComponent(status)}&urgency=${encodeURIComponent(urgency)}&sort_by=${encodeURIComponent(sort)}`;

            try {
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                if (data.status === 'success') {
                    totalPages = data.pages || 1;
                    document.getElementById('pagination-info').innerText = `Page ${data.page} of ${totalPages} (Total Records: ${data.total})`;

                    const tbody = document.getElementById('history-tbody');
                    tbody.innerHTML = '';

                    if (data.data && data.data.length > 0) {
                        data.data.forEach(r => {
                            tbody.innerHTML += `
                                <tr>
                                    <td style="font-family:monospace; font-weight:800; color:var(--primary-crimson);">${r.public_request_id}</td>
                                    <td><strong>${r.patient_name}</strong> (${r.patient_age} yrs)</td>
                                    <td><span style="font-weight:900; color:var(--primary-red);">${r.blood_group}</span></td>
                                    <td>${r.component}</td>
                                    <td>${r.units_required} Bag(s)</td>
                                    <td>${r.hospital_name}, ${r.hospital_city}</td>
                                    <td><span style="font-weight:800;">${r.urgency}</span></td>
                                    <td><span style="font-weight:800; color:#047857;">${r.status}</span></td>
                                    <td>${r.required_date}</td>
                                    <td>
                                        <a href="/request-tracking/${r.public_request_id}" class="btn-hero-primary" style="padding:4px 10px; font-size:0.75rem;">Track</a>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--text-muted); padding:30px;">No requests found matching your filter criteria.</td></tr>`;
                    }
                }
            } catch (err) { console.error('History load error:', err); }
        }

        function changePage(delta) {
            const target = currentPage + delta;
            if (target >= 1 && target <= totalPages) {
                loadRequestHistory(target);
            }
        }

        loadRequestHistory(1);
    </script>
</body>
</html>
